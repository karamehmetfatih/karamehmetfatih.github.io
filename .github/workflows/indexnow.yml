# Pings IndexNow whenever the published site changes, so the participating
# engines (Bing, Yandex, Seznam, Naver, DuckDuckGo) refetch a page instead of
# waiting for their own crawl schedule to come round. Google does not take part
# in the protocol; nothing here affects it either way.
#
# Submission is driven off the sitemap rather than a hand-kept URL list. Quarto
# rewrites docs/sitemap.xml on every render, so it is the one file that always
# knows what the site contains and when each page last changed — which also
# means the run is incremental for free: only URLs whose `lastmod` is inside the
# `since` window below get submitted, not the whole site on every push.

name: IndexNow

on:
  # Chained to the Pages deploy rather than to `push`. The action reads the
  # sitemap from the LIVE site, so it cannot run until the deploy that produced
  # that sitemap is actually serving. The first version of this workflow fired
  # on push and tried to bridge the gap by polling the live sitemap until it
  # matched the commit — which cannot work, see the cache note below.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      since_days:
        description: 'Submit pages whose sitemap lastmod falls within this many days'
        required: false
        default: '1'

permissions: {}

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    # workflow_run fires whatever the outcome, so a failed Pages build would
    # otherwise submit against whatever is still deployed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Fetch the sitemap ourselves before handing the URL to the action, for
      # two reasons.
      #
      # Cache: www.mfkara.net is behind Cloudflare, in front of GitHub's own
      # Fastly cache, and the sitemap is served with `Cache-Control: max-age=600`.
      # A Pages deploy purges GitHub's cache but has no way to purge Cloudflare's,
      # so for up to ten minutes after a deploy the edge can still hand out the
      # previous sitemap. A `Cache-Control: no-cache` request header does not
      # help — that is a request directive an edge is free to ignore, and
      # Cloudflare does. A changing query string does work: query strings are
      # part of the cache key by default, so `?v=<run id>` is a guaranteed miss
      # and comes from the origin.
      #
      # Diagnosis: when the fetch returns something that is not XML, the action
      # fails deep inside its XML parser with a message that names neither the
      # URL nor the response ("Tag '=' is an invalid name.:1:1343"). Checking
      # here means an HTML error or challenge page is reported as exactly that,
      # with the first part of the body in the log.
      - name: Fetch and validate the live sitemap
        id: sitemap
        env:
          SITEMAP: https://www.mfkara.net/sitemap.xml
        run: |
          set -uo pipefail
          url="${SITEMAP}?v=${GITHUB_RUN_ID}"

          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.xml -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q '<urlset' body.xml; then
              echo "Sitemap OK on attempt ${attempt} ($(grep -c '<loc>' body.xml) URLs)."
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}, not a sitemap. Retrying in 30s."
            sleep 30
          done

          echo "::error::Could not fetch a valid sitemap from ${url} (last HTTP ${code})."
          echo "First 300 bytes of what came back instead:"
          head -c 300 body.xml || true
          exit 1

      # Pinned to the commit behind tag v3 (v3.0.0, tagged 2026-05-26), not to
      # the tag itself: a tag is a movable pointer, and `@v3` or `@master` would
      # let the upstream repo change what runs here without a commit in this one.
      - name: Submit changed URLs to IndexNow
        uses: bojieyang/indexnow-action@38ddfbd93579a8a44c0dee662121bf9d51098f71 # v3.0.0
        with:
          sitemap-location: ${{ steps.sitemap.outputs.url }}

          # Deliberately not a repository secret. An IndexNow key is public by
          # design — the protocol verifies domain ownership by fetching the key
          # back from the site root, so anyone can already read it at
          # https://www.mfkara.net/944edb0f8e4b459e8b54cf5c3eb92a45.txt. Hiding
          # it in `secrets` would add a second place to keep in sync, protect
          # nothing, and make the mismatch that breaks submission (key file vs.
          # key value) invisible in review. See the note in _quarto.yml, where
          # the same key is registered as a project resource so it survives to
          # docs/ on every render.
          #
          # These two must agree with each other AND with the deployed file, or
          # the endpoint answers 403. Changing the key means changing three
          # things: the file at the project root, the _quarto.yml resource entry,
          # and this pair.
          key: '944edb0f8e4b459e8b54cf5c3eb92a45'
          key-location: https://www.mfkara.net/944edb0f8e4b459e8b54cf5c3eb92a45.txt

          # Neutral endpoint. Submitting to any one participating engine shares
          # the URLs with all the others, so this is a matter of not picking a
          # side rather than of coverage.
          endpoint: api.indexnow.org

          # Empty on workflow_run, where the input does not exist, so it falls
          # through to one day. Widen it from the Actions tab to force a
          # resubmission of older pages.
          since: ${{ inputs.since_days || '1' }}
          since-unit: day

          # Upstream defaults to `ignore`, which turns a rejected key into a
          # green tick and months of silently unindexed pages. A 403 here should
          # be loud. The preflight above means a failure at this point is a real
          # IndexNow problem rather than a fetch that went sideways.
          failure-strategy: error
