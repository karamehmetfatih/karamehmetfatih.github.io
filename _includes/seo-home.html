<!-- Home page SEO head additions.

     Quarto already emits og:title, og:image, og:site_name and the twitter-card
     tags (open-graph / twitter-card are on in _quarto.yml). It does not emit
     og:url, og:type, og:locale or a canonical link, so those are added here
     rather than duplicated.

     The JSON-LD is one @graph rather than three separate <script> blocks so the
     nodes can reference each other by @id: the WebSite is published by the
     Person, and the page is *about* that same Person. `sameAs` is the load
     bearing part — it is what ties this domain to the ORCID / Scholar / Scopus
     records that already carry the publication history, so a search for the
     name can resolve to one entity instead of several. -->

<meta property="og:url" content="https://www.mfkara.net/">
<meta property="og:type" content="profile">
<meta property="og:locale" content="en_GB">
