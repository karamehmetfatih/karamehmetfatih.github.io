project:
  type: website
  output-dir: docs
  preview:
    port: 4200
  # Copied verbatim into docs/ on every render so the GitHub Pages
  # custom domain survives Quarto clearing the output directory.
  resources:
    - CNAME
    # IndexNow ownership key for Bing/Yandex/Seznam. The protocol verifies the
    # domain by fetching a file whose NAME is the key and whose CONTENT is the
    # same key, from the site root — so both halves have to match exactly and
    # the file has to survive to docs/.
    #
    # It needs listing here, unlike CNAME and robots.txt: Quarto auto-copies
    # only a fixed set of well-known filenames (robots.txt, .nojekyll, CNAME,
    # _redirects, 404) and an arbitrary .txt at the project root is not one of
    # them. Without this line it never reaches the output and verification
    # fails with the file simply 404ing.
    #
    # Not a secret despite the name — it is designed to be publicly fetchable,
    # and must be committed, not gitignored.
    #
    # Replaced 8f8e944fd46f40088e3e0025a6797315 on 2026-08-21. Removal from this
    # list is what retires a key: Quarto clears docs/ on every render, so a key
    # absent here stops being served at the next one, whatever is left lying
    # around at the project root. Exactly one entry belongs below.
    - 944edb0f8e4b459e8b54cf5c3eb92a45.txt
    # The Person `image` in the homepage JSON-LD (_includes/seo-home.html).
    # Quarto copies an image to docs/ only when a page references it in a form
    # it can see — markdown, an <img>, front matter. A full URL inside a JSON
    # string in an include is none of those, so nothing brought this file
    # along: it stopped being published when the on-page portrait was dropped,
    # and the structured data has pointed at a 404 since. Listing it here
    # publishes it at the same path, assets/img/profile.jpg.
    #
    # Remove this line only together with the `image` in seo-home.html.
    - assets/img/profile.jpg
    # The GeoCities skin. Quarto copies a stylesheet named in `css:` by itself,
    # but not what the rest of the theme reaches for: geocities.js is pulled in
    # by a <script src> inside a header include, sprout.svg by an <img> inside
    # _includes/gc-header.html, sprout-cursor.svg from a url() inside the CSS,
    # and social-card.png only from <meta> tags. None of those are forms Quarto
    # scans for dependencies, so the directory is published wholesale.
    - assets/geocities/
  # Repairs the redirect stubs Quarto writes for `aliases:` — /about.html and
  # /papers/. It emits them with a JS-only <head>: no description (which is what
  # an SEO audit flags them for), no canonical, the literal title "Redirect",
  # and — on a Windows render — backslashes inside the redirect URL. The script
  # is idempotent, so rendering twice changes nothing the second time.
  #
  # Needs `python` on PATH. It is stdlib-only, so any Python 3 will do, but a
  # render from an environment without one fails here rather than silently
  # shipping the unpatched stubs.
  post-render:
    - python scripts/finish-alias-stubs.py
  # `*.qmd` only, so TODO.md and other notes at the root never become pages.
  #
  # Unfinished work lives in `_parked/` — the blog, the showcase, and image
  # files nothing on the site references. The underscore is what parks it:
  # Quarto skips underscore-prefixed directories when discovering pages, the
  # same convention that keeps `_includes/` and `_sass/` from rendering, so no
  # exclusion rule is needed here. Anything outside an underscore directory is
  # live, and its path is its URL.
  render:
    - "*.qmd"

website:
  title: "M. Fatih Kara"
  site-url: "https://www.mfkara.net"
  repo-url: "https://github.com/karamehmetfatih/karamehmetfatih.github.io"
  # The pixel-art sprout, in PANTONE 13-0324 TCX Lettuce Green like everything
  # else here. An SVG favicon scales to every tab size; assets/img/favicon.png
  # stays in the repo as the al-folio-era fallback.
  favicon: assets/geocities/sprout.svg
  # Fallback description for any page that does not set its own, and the text
  # used in the WebSite node of the JSON-LD (_includes/seo-home.html) — keep the
  # two in step. "and notes" was dropped: there are no notes, and the blog it
  # implied is parked.
  description: "Personal site of Mehmet Fatih Kara — plant scientist researching disease resistance in lettuce, and publications."
  # Fallback preview image: the 1200x630 GeoCities card, in the house colour.
  # Site-absolute, or it is resolved relative to each page and breaks in
  # subdirectories. Any page can override it with `image:` in its front matter.
  image: /assets/geocities/social-card.png
  # No navbar, no search box, no page-footer: navigation lives in the sidebar
  # of _includes/gc-header.html, and the colophon in _includes/gc-footer.html.
  # Quarto's own chrome would be rendered unstyled here (there is no Bootstrap
  # to style it — see `theme: none` below), so it is switched off rather than
  # hidden with CSS.
  page-navigation: false
  open-graph:
    image: /assets/geocities/social-card.png
    image-alt: "~mfkara's Leafy Homepage — plant immunity, necrotrophic fungi, lettuce"
    locale: en_GB
  twitter-card:
    image: /assets/geocities/social-card.png
    image-alt: "~mfkara's Leafy Homepage — plant immunity, necrotrophic fungi, lettuce"
    card-style: summary_large_image

format:
  html:
    # No Bootstrap, no SCSS layer: the whole look is one hand-written
    # stylesheet. `theme: none` is what makes that possible — with a theme set,
    # Bootstrap's reboot would fight every rule in geocities.css, and Quarto
    # would emit a navbar and footer the stylesheet then has to hide.
    #
    # The al-folio theme this site used before is kept in _parked/al-folio/
    # (_sass/*.scss plus assets/css/styles.css) rather than deleted: restoring
    # it is a matter of moving those back and undoing this block.
    theme: none
    css: assets/geocities/geocities.css
    # The GeoCities layout is a two-column table whose left cell IS the
    # navigation, so a Quarto sidebar TOC would be a third column with nowhere
    # to go. Pages that want one can still set `toc: true` for themselves.
    toc: false
    anchor-sections: false
    # Quarto appends " – M. Fatih Kara" (the site title) to each page's title
    # tag. The pages set their own `pagetitle`, which already names the person
    # or the subject, so the suffix would say it twice.
    title-prefix: ""
    include-before-body: _includes/gc-header.html
    include-after-body: _includes/gc-footer.html
    # Project-level header includes. Page-level `include-in-header:` entries
    # (the seo-*.html files) are appended to these rather than replacing them,
    # so both arrive in the <head>.
    include-in-header:
      - text: |
          <!-- `author` is set here rather than as document front matter because
               Quarto would also print an author byline into the title block;
               only the <meta> tag is wanted. `max-image-preview:large` opts
               link previews in search results up from a thumbnail to a
               full-width image; pages that must stay out of the index add
               their own `noindex` via _includes/noindex.html, and where two
               robots tags disagree the more restrictive one wins. -->
          <meta name="author" content="Mehmet Fatih Kara">
          <meta name="robots" content="max-image-preview:large">
          <meta name="keywords" content="plant immunity, MPMI, Botrytis cinerea, Sclerotinia sclerotiorum, lettuce, Lactuca sativa, LsRTDv1, transcriptomics, alternative splicing, genome editing, CRISPR, plant pathology">
          <!-- Atkinson Hyperlegible Next, the body face (see `--font` in
               geocities.css). The full variable range rather than a handful of
               static weights: the stylesheet asks for bold headings and bold
               chrome, and any weight not fetched would be synthesised by the
               browser. `display=swap` so text paints in the fallback face
               immediately and never hides behind the font request. -->
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&amp;display=swap">
          <!-- Theme switcher, hit counter and sparkle trail. Deferred, so none
               of it blocks the first paint; everything it does is decoration
               that the page reads correctly without. -->
          <script src="/assets/geocities/geocities.js" defer></script>
