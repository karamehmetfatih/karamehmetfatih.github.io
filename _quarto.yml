project:
  type: website
  output-dir: docs
  preview:
    port: 4200
  # Copied verbatim into docs/ on every render so the GitHub Pages
  # custom domain survives Quarto clearing the output directory.
  resources:
    - CNAME
  render:
    - "*.qmd"

website:
  title: "Mehmet Fatih Kara"
  site-url: "https://www.mfkara.net"
  repo-url: "https://github.com/karamehmetfatih/karamehmetfatih.github.io"
  favicon: img/favicon.png
  description: "Personal site of Mehmet Fatih Kara — plant science research on disease resistance in lettuce, publications, and notes."
  # Fallback preview image for Open Graph / Twitter cards on pages
  # that do not set their own `image:`. Must be site-absolute, or it is
  # resolved relative to each page (breaking the URL for posts).
  image: /img/profile.jpg
  back-to-top-navigation: true
  navbar:
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/karamehmetfatih/karamehmetfatih.github.io
          - text: Report an Issue
            href: https://github.com/karamehmetfatih/karamehmetfatih.github.io/issues
    background: light
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: posts/index.qmd
        text: Blog
      - href: research/index.qmd
        text: Publications
  search: 
    location: navbar
    type: textbox
  page-footer:
    background: dark
    center: © 2026  &middot; Made with {{< fa brands r-project >}} and 
      [![](https://quarto.org/quarto.png){fig-alt="Quarto" width=65px}](https://quarto.org/)

format:
  html:
    theme:
      light: [litera, al-folio.scss]
      dark: [darkly, al-folio.scss, al-folio-dark.scss]
    mainfont: "Atkinson Hyperlegible Next"
    monofont: "Atkinson Hyperlegible Mono"
    css: styles.css
    toc: true
    open-graph: true
    twitter-card: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Atkinson+Hyperlegible+Mono:ital,wght@0,400;0,700;1,400&display=swap">



