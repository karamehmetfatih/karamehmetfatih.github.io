project:
  type: website
  output-dir: docs
  preview:
    port: 4200
  # Copied verbatim into docs/ on every render so the GitHub Pages
  # custom domain survives Quarto clearing the output directory.
  resources:
    - CNAME
  render:
    - "*.qmd"
    # Showcase is parked, not deleted. Excluding it from the render keeps its
    # pages out of docs/ and out of search.json, while showcase/ stays on disk
    # ready to switch back on: drop this line and uncomment the navbar entry.
    - "!showcase/**"

website:
  title: "M. Fatih Kara"
  site-url: "https://www.mfkara.net"
  repo-url: "https://github.com/karamehmetfatih/karamehmetfatih.github.io"
  favicon: assets/img/favicon.png
  description: "Personal site of Mehmet Fatih Kara — plant science research on disease resistance in lettuce, publications, and notes."
  # Fallback preview image for Open Graph / Twitter cards on pages
  # that do not set their own `image:`. Must be site-absolute, or it is
  # resolved relative to each page (breaking the URL for posts).
  image: /assets/img/profile.jpg
  navbar:
    # The GitHub mark links straight to the repository. It was a dropdown of
    # two items; with one destination left, a menu is only a click in the way.
    # `aria-label` matters here: the control is icon-only, so without it the
    # link has no accessible name at all.
    tools:
      - icon: github
        href: https://github.com/karamehmetfatih/karamehmetfatih.github.io
        aria-label: Source code on GitHub
    background: light
    search: true
    # The navbar is fixed-top either way, but Quarto wires it to Headroom.js,
    # which slides it out of view on scroll-down and back in on scroll-up.
    # `pinned` disables that, so the header simply stays put.
    pinned: true
    # Lowercase labels are a style choice for the nav links only. The brand
    # ("M. Fatih Kara", from `website: title:` above) keeps its capitals — it
    # is a name, and the same string is reused in every page's <title>.
    left:
      - href: index.qmd
        text: about
      # Parked. This entry emitted `href="./_posts/index.qmd"` on every page of
      # the site — a 404 in the primary navigation, which is both a dead end for
      # visitors and a crawl error repeated site-wide.
      #
      # The cause is the underscore: Quarto skips underscore-prefixed
      # directories when discovering *pages*, so `_posts/` is copied to docs/ as
      # a raw resource and never rendered. (The same convention is what lets
      # `_sass/` and `_includes/` hold theme and partial files without becoming
      # pages.) The navbar then links to a .qmd that has no .html.
      #
      # To switch the blog back on, both halves are needed:
      #   1. rename `_posts/` to `posts/` so Quarto renders it, and update the
      #      href below to posts/index.qmd;
      #   2. replace `_posts/deneme/` — it is still the Quarto template's demo
      #      post ("Deneme 2", dated 2021) and is the only entry in the
      #      listing. Publishing it would put a placeholder page in the index
      #      under this site's name, which is worse than having no blog.
      # - href: posts/index.qmd
      #   text: blog
      - href: research/index.qmd
        text: publications
      # - href: cv/index.qmd
      #   text: cv
      # Parked — see the render exclusion at the top of this file.
      # - href: showcase/index.qmd
      #   text: showcase
  search:
    location: navbar
    type: overlay
    limit: 10
    keyboard-shortcut: ["?", "H"]
  page-footer:
    background: dark
    # Folded (>-) so the colophon is one markdown paragraph regardless of how
    # it is wrapped here; the two visible rows come from the explicit <br>, not
    # from the line breaks below. A <br> rather than two paragraphs keeps the
    # rows on one line-height instead of a full paragraph gap.
    #
    # The GitHub logo is the "GitHub Pages" wordmark, so the word Pages is part
    # of the artwork and is not repeated as text after it. It is wider per unit
    # of height than the Quarto mark (169x34 vs 320x77), hence the larger width
    # for the same optical size. Both logos are site-absolute (/assets/img/...) for
    # the same reason as the OG image above: the footer is emitted on every
    # page, including nested posts.
    #
    # The R and Bootstrap marks are font glyphs, not images, so they take no
    # width: `size` is the equivalent knob. `lg` resolves to fa-lg (1.25em),
    # which at the footer's 0.8rem is 16px tall — matching the Quarto logo's
    # 15.6px at width=65px, so all four marks line up. Valid sizes are
    # xs/sm/lg/xl/2xl; `fa-l` exists but is the letter-L icon, not a size.
    # `label` overrides the shortcode's default aria-label (the raw icon name),
    # which now has to serve as the link's accessible name.
    center: >-
      © Copyright 2026 M. Fatih Kara<br>
      Made with [{{< fa brands r-project size=lg title="R" label="R" >}}](https://www.r-project.org/) and
      [![](https://quarto.org/quarto.png){.footer-logo fig-alt="Quarto" width=65px}](https://quarto.org/).
      [Powered by [{{< fa brands bootstrap size=lg title="Bootstrap" label="Bootstrap" >}}](https://getbootstrap.com/) with an
      [al-folio](https://github.com/alshedivat/al-folio)-inspired theme.]{.footer-secondary}
      Hosted by
      [![](/assets/img/logo.svg){.footer-logo fig-alt="GitHub Pages" width=65px}](https://pages.github.com/).

format:
  html:
    # _sass/ mirrors al-folio. Quarto skips underscore-prefixed directories when
    # discovering *pages*, but theme files are resolved as paths rather than
    # inputs, so they load fine from here.
    theme:
      light: [litera, _sass/al-folio.scss]
      dark: [darkly, _sass/al-folio.scss, _sass/al-folio-dark.scss]
    # One face for the whole site, code included.
    mainfont: "Atkinson Hyperlegible Next"
    monofont: "Atkinson Hyperlegible Next"
    css: assets/css/styles.css
    # Site-wide default: no rendered title block. These pages carry the site
    # name in the navbar brand instead, so a heading above the content would
    # only repeat it. index.qmd opts back in, and hides the brand in turn —
    # see the note in its front matter.
    title-block-style: none
    toc: true
    open-graph: true
    twitter-card: true
    include-in-header:
      - text: |
          <!-- Site-wide metadata. `author` is set here rather than as document
               front matter because Quarto would also print an author byline
               into the title block; only the <meta> tag is wanted.

               The robots value carries no index/follow — those are already the
               default, and stating them adds nothing. `max-image-preview:large`
               does change behaviour: it opts link previews in search results
               up from a thumbnail to a full-width image. Pages that need to
               stay out of the index add their own `noindex` via
               _includes/noindex.html; where two robots tags disagree the more
               restrictive one wins, so the two compose correctly. -->
          <meta name="author" content="Mehmet Fatih Kara">
          <meta name="robots" content="max-image-preview:large">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <!-- Full variable range (200-800, upright + italic) rather than a
               handful of static weights: the SCSS asks for 500 headings and
               600 chrome, and any weight not fetched would be synthesised by
               the browser or fall back to a different face. -->
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap">
    # Back-to-top control, pinned bottom-right. This is a hand-rolled control
    # rather than Quarto's `back-to-top-navigation`, which was switched off in
    # the website block above: that one appends a text link at the end of the
    # content column, not a floating button. Styling lives in al-folio.scss.
    #
    # role/tabindex/aria-label are added to the markup because a bare <div> is
    # neither focusable nor announced; the keydown handler completes it, so the
    # control works by keyboard as well as by mouse.
    include-after-body:
      - text: |
          <div id="back-to-top" class="" role="button" tabindex="0" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"></path></svg></div>
          <script>
          (function () {
            var btn = document.getElementById('back-to-top');
            if (!btn) return;
            var SHOW_AFTER = 300; // px scrolled before it fades in

            function toggle() {
              btn.classList.toggle('show', window.scrollY > SHOW_AFTER);
            }

            function toTop() {
              var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
              window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
            }

            // Passive: this fires on every scroll frame and never calls preventDefault.
            window.addEventListener('scroll', toggle, { passive: true });
            toggle(); // a reload can restore a scrolled position

            btn.addEventListener('click', toTop);
            btn.addEventListener('keydown', function (event) {
              // Buttons activate on both keys; a <div> has to be told.
              if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') {
                event.preventDefault();
                toTop();
              }
            });
          })();

          // The footer is pinned (position: fixed in al-folio.scss), so it no
          // longer takes up space in flow. Publish its height as a custom
          // property; the SCSS uses it to pad the body and to lift the
          // back-to-top button clear. Measured rather than hard-coded because
          // the colophon rewraps to more lines as the window narrows.
          (function () {
            var footer = document.querySelector('footer.footer');
            if (!footer) return;

            function sync() {
              document.documentElement.style.setProperty(
                '--af-footer-height', footer.offsetHeight + 'px');
            }

            sync();
            if (window.ResizeObserver) {
              new ResizeObserver(sync).observe(footer);
            } else {
              window.addEventListener('resize', sync);
            }
          })();

          // Ctrl+K (Cmd+K on macOS) opens search.
          //
          // Not done through Quarto's own `search: keyboard-shortcut:`, which
          // takes single characters only and matches them with no modifier
          // check — registering "k" there would fire on every bare k typed on
          // the page. Quarto's own f / / / s defaults still work.
          //
          // keydown rather than keyup, because Ctrl+K is the browser's own
          // shortcut (address bar in Chrome, quick search in Firefox) and only
          // keydown can preventDefault it.
          (function () {
            var isMac = /Mac|iPod|iPhone|iPad/.test(
              navigator.platform || navigator.userAgent);

            // Quoted, because this lands in a CSS `content` value.
            document.documentElement.style.setProperty(
              '--af-search-kbd', isMac ? '"⌘ K"' : '"Ctrl K"');

            var search = document.getElementById('quarto-search');
            if (search) {
              search.setAttribute('aria-keyshortcuts', isMac ? 'Meta+K' : 'Control+K');
            }

            document.addEventListener('keydown', function (event) {
              if (event.key !== 'k' && event.key !== 'K') return;
              if (event.altKey) return;
              if (!(isMac ? event.metaKey : event.ctrlKey)) return;

              event.preventDefault();
              if (typeof window.quartoOpenSearch === 'function') {
                window.quartoOpenSearch();
              } else {
                // Search JS not ready yet: focus the field directly.
                var input = document.querySelector('#quarto-search .aa-Input');
                if (input) input.focus();
              }
            });
          })();
          </script>



